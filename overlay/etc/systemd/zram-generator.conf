# 2026-09-20 追加: RAM 1.6GiB でADS-Bコンテナを回すため圧縮スワップを用意する。
# 旧4.9環境には /mnt/data/swapfile 2GB があったが、6.18環境にはスワップが無かった。
# ⚠️ compression-algorithm は現カーネル(run38)では lzo-rle しか選べない
#    (CONFIG_ZRAM_BACKEND_LZ4 未設定のため)。run39 以降で lz4 に変更する。
[zram0]
zram-size = 768
compression-algorithm = lz4
swap-priority = 100
